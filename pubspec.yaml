name: finsense
description: "A premium personal finance tracker built with Flutter and Firebase."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.4
  firebase_auth: ^5.5.0
  firebase_core: ^3.12.0
  firebase_storage: ^12.4.4
  fl_chart: ^0.70.2
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^15.1.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
